<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Jonathan Odafe Eveso</title>

    <style>
        :root {
            --green: #2E7D32;
            --blue: #0288D1;
            --light-gray: #f4f4f4;
            --bg: #FFFFFF;
            --text: #333333;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #FFFFFF;
            --green: #1B5E20;
            --blue: #0277BD;
            --light-gray: #1E1E1E;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        nav {
            background-color: var(--green);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-links a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.9rem;
        }

        .toggle-switch {
            position: relative;
            width: 46px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--blue);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .section {
            padding: 50px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .section h1, .section h2 {
            color: var(--green);
        }

        .section h2 {
            border-left: 6px solid var(--blue);
            padding-left: 10px;
            margin-top: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: var(--light-gray);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
