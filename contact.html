<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jonathan Odafe Eveso</title>

    <style>
        :root {
            --green: #2E7D32;
            --blue: #0288D1;
            --bg: #FFFFFF;
            --text: #333333;
            --icon-filter: invert(0);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #FFFFFF;
            --green: #1B5E20;
            --blue: #0277BD;
            --icon-filter: invert(1);
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        nav {
            background-color: var(--green);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-links a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.9rem;
        }

        .toggle-switch {
            position: relative;
            width: 46px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--blue);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .section {
            padding: 50px 20px;
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: var(--green);
            margin-bottom: 30px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .icon-grid img {
            width: 60px;
            height: 60px;
            filter: var(--icon-filter);
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }

        .icon-grid img:hover {
            transform: scale(1.15);
            opacity: 0.8;
        }

        footer {
            background-color: var(--green);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="research.html">Research</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="toggle-container">
            <span>Dark mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </nav>

    <div class="section">
        <h1>Contact</h1>

        <p>Email: <strong>jonathan.eveso@uni-konstanz.de</strong></p>

        <div class="icon-grid">

            <!-- ORCID -->
            <a href="https://orcid.org/0000-0003-2647-3845" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/06/ORCID_iD.svg" alt="ORCID">
            </a>

            <!-- Google Scholar -->
            <a href="https://scholar.google.com/citations?user=DvmhCawAAAAJ" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Scholar_logo.svg" alt="Google Scholar">
            </a>

            <!-- ResearchGate -->
            <a href="https://www.researchgate.net/profile/Jonathan-Eveso?ev=hdr_xprf" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/ResearchGate_icon_SVG.svg" alt="ResearchGate">
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/jonathaneveso/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn">
            </a>

            <!-- X (Twitter) -->
            <a href="https://x.com/mr_jeveso" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/X_logo_2023_original.svg" alt="X">
            </a>

            <!-- Bluesky -->
            <a href="https://bsky.app/profile/jeveso.bsky.social" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Bluesky_Logo.svg" alt="Bluesky">
            </a>

        </div>
    </div>

    <footer>
        © 2025 Jonathan Odafe Eveso — Contact
    </footer>

    <script>
        const toggle = document.getElementById('theme-toggle');
        const storedTheme = localStorage.getItem('theme');

        if (storedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggle.checked = true;
        }

        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>

</body>
</html>
